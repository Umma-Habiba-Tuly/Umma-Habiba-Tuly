<rect x="40" y="224" width="402" height="8" rx="4" fill="#fff" fill-opacity=".1"/>
<rect x="40" y="224" width="395" height="8" rx="4" fill="#8f94fb"/><rect x="435" y="224" width="7" height="8" rx="3" fill="#ffd479"/>
