<rect x="146" y="176" width="80" height="28" rx="14" fill="#5559c9" fill-opacity=".9"/><text x="186" y="195" text-anchor="middle" fill="#ffffff">Next.js</text>
<rect x="236" y="176" width="116" height="28" rx="14" fill="#5559c9" fill-opacity=".9"/><text x="294" y="195" text-anchor="middle" fill="#ffffff">Tailwind CSS</text>
<rect x="362" y="176" width="80" height="28" rx="14" fill="#5559c9" fill-opacity=".9"/><text x="402" y="195" text-anchor="middle" fill="#ffffff">Docker</text>
