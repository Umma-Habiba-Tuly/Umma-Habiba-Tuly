</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f55"/><stop offset=".6" stop-color="#0f1236"/><stop offset="1" stop-color="#0a0b24"/></linearGradient>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a78"/><stop offset=".55" stop-color="#1c1a52"/><stop offset="1" stop-color="#0d0f2e"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f94fb"/><stop offset=".5" stop-color="#ff8a6a"/><stop offset="1" stop-color="#ffd479"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a66"/><stop offset=".6" stop-color="#8a4a7e"/><stop offset="1" stop-color="#e8806f"/></linearGradient>
<clipPath id="q"><rect x="660" y="2" width="338" height="256" rx="20"/></clipPath>
</defs>
<g font-family="'Segoe UI',Arial,sans-serif">

