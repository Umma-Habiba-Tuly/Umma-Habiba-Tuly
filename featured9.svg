<text x="40" y="104" font-size="40" font-weight="800" class="tw">tuly-portfolio</text>
<text x="40" y="134" font-size="16" class="td">Personal portfolio website with a Docker</text>
<text x="40" y="156" font-size="16" class="td">production deployment.</text>
<g font-size="13" font-weight="700">
