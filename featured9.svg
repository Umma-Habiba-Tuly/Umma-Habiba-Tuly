<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Featured project: tuly-portfolio, a personal portfolio website built with Next.js, TypeScript and Tailwind CSS with Docker deployment. Quote: As numbers are reduced to the simplest principles, like 0 and 1, a wonderful order is apparent throughout. Gottfried Wilhelm Leibniz.">
<title>Featured project and quote</title>
<style>
.tw{fill:#fff}.td{fill:#d6c8ff}.ty{fill:#ffd479}.tp{fill:#ff8fb8}.c1{fill:#9cc4f5}.c2{fill:#9fe8ff}.c3{fill:#9fd2f7}
