<text x="829" y="92" text-anchor="middle" font-size="72" font-weight="800" class="ty" font-family="Georgia,serif">&#8220;</text>
<g text-anchor="middle" font-size="17.5" font-weight="600" class="tw">
<text x="829" y="118">As numbers are reduced to the</text>
