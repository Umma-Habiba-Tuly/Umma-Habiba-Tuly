<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Featured project: tuly-portfolio. Personal portfolio website built with Next.js, TypeScript and Tailwind CSS, with Docker production deployment. 98 percent TypeScript.">
<title>tuly-portfolio</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f55"/><stop offset=".6" stop-color="#0f1236"/><stop offset="1" stop-color="#0a0b24"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f94fb"/><stop offset=".5" stop-color="#ff8a6a"/><stop offset="1" stop-color="#ffd479"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a66"/><stop offset=".6" stop-color="#8a4a7e"/><stop offset="1" stop-color="#e8806f"/></linearGradient>
<radialGradient id="glow" cx=".8" cy=".5" r=".6"><stop offset="0" stop-color="#8f94fb" stop-opacity=".35"/><stop offset="1" stop-color="#8f94fb" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect x="2" y="2" width="896" height="256" rx="20"/></clipPath>
<clipPath id="win"><rect x="548" y="34" width="312" height="192" rx="12"/></clipPath>
</defs>
<rect x="2" y="2" width="896" height="256" rx="20" fill="url(#bg)"/>
<g clip-path="url(#card)"><rect x="440" y="0" width="460" height="260" fill="url(#glow)"/></g>
<rect x="2" y="2" width="896" height="256" rx="20" fill="none" stroke="url(#bd)" stroke-width="2.5"/>

<g font-family="'Segoe UI',Arial,sans-serif">
<text x="44" y="56" font-size="13" letter-spacing="4" fill="#ffd479" font-weight="700">FEATURED PROJECT</text>
<text x="44" y="104" font-size="42" font-weight="800" fill="#fff">tuly-portfolio</text>
<text x="44" y="136" font-size="17" fill="#d6c8ff">Personal portfolio website with a Docker production deployment.</text>

<g font-size="13" font-weight="600">
<rect x="44" y="154" width="96" height="28" rx="14" fill="#3178c6" fill-opacity=".25" stroke="#3178c6"/><text x="92" y="173" text-anchor="middle" fill="#9cc4f5">TypeScript</text>
<rect x="150" y="154" width="80" height="28" rx="14" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".6"/><text x="190" y="173" text-anchor="middle" fill="#fff">Next.js</text>
<rect x="240" y="154" width="116" height="28" rx="14" fill="#38bdf8" fill-opacity=".2" stroke="#38bdf8"/><text x="298" y="173" text-anchor="middle" fill="#9fe8ff">Tailwind CSS</text>
<rect x="366" y="154" width="80" height="28" rx="14" fill="#2496ed" fill-opacity=".22" stroke="#2496ed"/><text x="406" y="173" text-anchor="middle" fill="#9fd2f7">Docker</text>
</g>

<rect x="44" y="204" width="400" height="8" rx="4" fill="#fff" fill-opacity=".1"/>
<rect x="44" y="204" width="393" height="8" rx="4" fill="#3178c6"/>
<rect x="437" y="204" width="5" height="8" fill="#a78bfa"/>
<text x="44" y="234" font-size="13" fill="#b9bce8"><tspan fill="#3178c6">●</tspan> TypeScript 98%   <tspan fill="#a78bfa">●</tspan> CSS, JS, Docker 2%</text>
</g>

<!-- browser mock -->
<g>
<rect x="548" y="34" width="312" height="192" rx="12" fill="#0b0d26" stroke="#8f94fb" stroke-opacity=".7" stroke-width="2"/>
