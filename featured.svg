<rect x="548" y="34" width="312" height="26" fill="#1d2150"/>
<circle cx="564" cy="47" r="4" fill="#ff8a6a"/><circle cx="578" cy="47" r="4" fill="#ffd479"/><circle cx="592" cy="47" r="4" fill="#9fe8ff"/>
