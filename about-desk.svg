<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Original illustration: a girl with a dark brown hair bun and lilac headphones, seen from behind, working at two monitors with code on them.">
  <title>Girl coding at two monitors</title>
  <defs>
    <clipPath id="cut"><rect width="440" height="300"/></clipPath>
  </defs>
  <g clip-path="url(#cut)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- tech decoration -->
    <g stroke="#4c5a9e" stroke-width="2">
      <path d="M36 40 h14 M43 33 v14"/><path d="M130 24 h10 M135 19 v10"/><path d="M306 30 h10 M311 25 v10"/><path d="M40 260 h12 M46 254 v12"/><path d="M400 250 h12 M406 244 v12"/>
      <path d="M0 232 H132 M308 232 H440"/>
      <path d="M60 232 v28 M380 232 v28"/>
    </g>
    <g fill="#6b78c8"><circle cx="86" cy="52" r="2.5"/><circle cx="330" cy="60" r="2.5"/><circle cx="24" cy="206" r="2.5"/><circle cx="418" cy="214" r="2.5"/></g>

    <!-- HUD ring -->
    <g transform="translate(386 44)">
      <circle r="32" stroke="#6b78c8" stroke-width="2" stroke-dasharray="5 7"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/></circle>
      <circle r="20" stroke="#8f94fb" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#b7a5ff" stroke="none">&lt;/&gt;</text>
    </g>
    <path d="M334 28 h22 M334 40 h14" stroke="#4c5a9e" stroke-width="2"/>

    <!-- left monitor -->
    <rect x="10" y="72" width="140" height="100" rx="7" fill="#0f1330" stroke="#6b78c8" stroke-width="3"/>
    <rect x="22" y="86" width="52" height="20" rx="3" fill="#ff7ab8" stroke="none"/>
    <rect x="80" y="86" width="58" height="20" rx="3" fill="#2dd4bf" stroke="none"/>
    <rect x="22" y="112" width="62" height="20" rx="3" fill="#ffd166" stroke="none"/>
    <g fill="#8f94fb" stroke="none">
      <rect x="22" y="142" width="96" height="5" rx="2.5"><animate attributeName="width" values="30;96;96;30" keyTimes="0;.3;.8;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="22" y="153" width="74" height="5" rx="2.5"><animate attributeName="width" values="20;74;74;20" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="22" y="164" width="104" height="5" rx="2.5" opacity=".7"/>
    </g>
    <path d="M80 172 v26 M58 198 h44" stroke="#6b78c8" stroke-width="3"/>

    <!-- right monitor -->
    <rect x="290" y="72" width="140" height="100" rx="7" fill="#0f1330" stroke="#6b78c8" stroke-width="3"/>
    <rect x="298" y="82" width="34" height="82" rx="3" fill="#1d2352" stroke="none"/>
    <g stroke="none">
      <rect x="340" y="88" width="78" height="5" rx="2.5" fill="#b7a5ff"/>
      <rect x="348" y="99" width="56" height="5" rx="2.5" fill="#2dd4bf"/>
      <rect x="348" y="110" width="68" height="5" rx="2.5" fill="#ff7ab8"/>
      <rect x="340" y="121" width="44" height="5" rx="2.5" fill="#ffd166"/>
      <rect x="348" y="132" width="72" height="5" rx="2.5" fill="#8f94fb"/>
      <rect x="340" y="143" width="60" height="5" rx="2.5" fill="#2dd4bf"/>
      <rect x="348" y="154" width="30" height="5" rx="2.5" fill="#ff7ab8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M360 172 v26 M338 198 h44" stroke="#6b78c8" stroke-width="3"/>

    <!-- chair + hoodie (back view) -->
    <rect x="150" y="168" width="140" height="132" rx="28" fill="#2a2468" stroke="#6b78c8" stroke-width="4"/>
    <path d="M128 300 Q128 204 220 192 Q312 204 312 300 Z" fill="#f4a9d0" stroke="#2a1a12" stroke-width="5"/>
    <path d="M186 194 Q220 218 254 194" fill="#e58bbb" stroke="#2a1a12" stroke-width="4"/>
    <path d="M220 214 v70" stroke="#e58bbb" stroke-width="4"/>
    <rect x="205" y="176" width="30" height="22" rx="9" fill="#ffdcc0" stroke="#2a1a12" stroke-width="4"/>

    <!-- head from behind: hair, bun, headphones -->
    <circle cx="220" cy="50" r="24" fill="#3a2214" stroke="#2a1a12" stroke-width="5"/>
    <path d="M204 40 Q222 28 238 42" stroke="#5a3822" stroke-width="5"/>
    <ellipse cx="220" cy="124" rx="55" ry="58" fill="#3a2214" stroke="#2a1a12" stroke-width="5"/>
    <path d="M186 100 Q220 82 256 100" stroke="#5a3822" stroke-width="5"/>
    <path d="M196 132 Q218 152 212 176 M236 130 Q252 152 246 172 M178 136 Q184 158 192 170" stroke="#5a3822" stroke-width="4"/>
    <path d="M166 128 Q166 62 220 60 Q274 62 274 128" stroke="#b7a5ff" stroke-width="10"/>
    <path d="M166 128 Q166 62 220 60 Q274 62 274 128" stroke="#2a1a12" stroke-width="2" opacity=".5"/>
    <g>
      <ellipse cx="166" cy="134" rx="15" ry="25" fill="#b7a5ff" stroke="#2a1a12" stroke-width="4"/>
      <ellipse cx="166" cy="134" rx="7" ry="14" fill="#7a63e8"/>
      <ellipse cx="274" cy="134" rx="15" ry="25" fill="#b7a5ff" stroke="#2a1a12" stroke-width="4"/>
      <ellipse cx="274" cy="134" rx="7" ry="14" fill="#7a63e8"/>
      <ellipse cx="166" cy="134" rx="21" ry="31" stroke="#8fe9ff" stroke-width="3" opacity=".5"><animate attributeName="opacity" values=".15;.7;.15" dur="2.4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="274" cy="134" rx="21" ry="31" stroke="#8fe9ff" stroke-width="3" opacity=".5"><animate attributeName="opacity" values=".7;.15;.7" dur="2.4s" repeatCount="indefinite"/></ellipse>
    </g>

    <!-- desk edge in front of the chair -->
    <path d="M100 262 H340" stroke="#4c5a9e" stroke-width="2" stroke-dasharray="3 6"/>
  </g>
</svg>
