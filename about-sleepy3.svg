<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-label="Original cute illustration: a girl with a dark brown hair bun rests her head on a laptop, one hand raised, with a coffee mug. Text: One more bug!">
  <title>One more bug! illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2f78"/><stop offset="1" stop-color="#1a1d4d"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd3e6"/><stop offset="1" stop-color="#9aa1c0"/></linearGradient>
    <clipPath id="panel"><rect width="420" height="360" rx="24"/></clipPath>
    <path id="spark" d="M0-10 L2.6-2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6-2.6Z"/>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="420" height="360" fill="url(#bg)"/>
    <circle cx="48" cy="46" r="2" fill="#fff" opacity=".6"/><circle cx="372" cy="40" r="2" fill="#fff" opacity=".5"/>
    <circle cx="26" cy="150" r="2" fill="#fff" opacity=".4"/><circle cx="398" cy="130" r="2" fill="#fff" opacity=".5"/>
    <use href="#spark" x="352" y="112" fill="#ffd166"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#spark" x="64" y="96" fill="#ff9ac8"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></use>

    <text x="210" y="54" text-anchor="middle" font-family="'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="34" font-weight="900" fill="#fff1de" stroke="#2a1a12" stroke-width="8" stroke-linejoin="round" paint-order="stroke" textLength="280" lengthAdjust="spacingAndGlyphs">One more bug!</text>

    <!-- floating chips -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="40 92;40 82;40 92" dur="3s" repeatCount="indefinite"/>
      <rect width="54" height="30" rx="15" fill="#6a46f0" stroke="#2a1a12" stroke-width="4"/>
      <text x="27" y="21" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#fff">AI</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="100 128;100 138;100 128" dur="3.6s" repeatCount="indefinite"/>
      <rect width="60" height="30" rx="15" fill="#ea4b71" stroke="#2a1a12" stroke-width="4"/>
      <text x="30" y="21" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#fff">n8n</text>
    </g>

    <!-- desk -->
    <rect x="0" y="292" width="420" height="68" fill="#2b2468"/>
    <rect x="0" y="292" width="420" height="4" fill="#4a3f9c"/>
    <ellipse cx="140" cy="300" rx="120" ry="20" fill="#8fe9ff" opacity=".16"/>

    <!-- chair back -->
    <rect x="338" y="168" width="78" height="150" rx="24" fill="#6f5fb0" stroke="#2a1a12" stroke-width="5"/>
    <rect x="352" y="184" width="50" height="118" rx="14" fill="#8274c8"/>

    <!-- hoodie body -->
    <path d="M238 214 Q300 180 356 212 Q392 250 376 306 L238 306 Z" fill="#f4a9d0" stroke="#2a1a12" stroke-width="5" stroke-linejoin="round"/>
    <path d="M300 200 Q316 230 306 262" fill="none" stroke="#e58bbb" stroke-width="4" stroke-linecap="round"/>

    <!-- laptop: back of the lid at the left, keyboard under the head -->
    <polygon points="34,178 168,212 158,306 24,270" fill="url(#lid)" stroke="#2a1a12" stroke-width="5" stroke-linejoin="round"/>
    <text transform="translate(96 252) rotate(14)" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="26" font-weight="700" fill="#2d2f78">&lt;/&gt;</text>
    <polygon points="24,270 158,306 262,290 130,252" fill="#7f86a8" stroke="#2a1a12" stroke-width="5" stroke-linejoin="round"/>

    <!-- resting hand -->
    <ellipse cx="206" cy="292" rx="17" ry="13" fill="#ffdcc0" stroke="#2a1a12" stroke-width="4"/>

    <!-- hair mass (head down on the keyboard) + bun -->
    <ellipse cx="240" cy="232" rx="88" ry="78" fill="#3a2214" stroke="#2a1a12" stroke-width="5"/>
    <circle cx="316" cy="168" r="34" fill="#3a2214" stroke="#2a1a12" stroke-width="5"/>
    <path d="M296 156 Q316 144 336 158" fill="none" stroke="#5a3822" stroke-width="5" stroke-linecap="round"/>
    <path d="M178 214 Q210 176 262 186 M196 244 Q226 214 280 226 M214 270 Q250 248 296 258" fill="none" stroke="#5a3822" stroke-width="5" stroke-linecap="round"/>
    <use href="#spark" x="296" y="196" fill="#ffd166" transform="translate(-296 -196) translate(296 196) scale(1.1)"/>
    <!-- a little face peeking out -->
    <ellipse cx="170" cy="268" rx="22" ry="14" fill="#ffdcc0" stroke="#2a1a12" stroke-width="4" transform="rotate(-18 170 268)"/>
    <path d="M160 266 Q168 260 176 266" fill="none" stroke="#2a1a12" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="158" cy="278" rx="7" ry="4" fill="#ff8fb0" opacity=".7"/>

    <!-- raised waving hand -->
    <g transform="translate(-24 0)"><g>
      <animateTransform attributeName="transform" type="rotate" values="0 280 224;-10 280 224;6 280 224;-10 280 224;0 280 224" dur="1.8s" repeatCount="indefinite"/>
      <rect x="262" y="116" width="36" height="112" rx="18" fill="#f4a9d0" stroke="#2a1a12" stroke-width="5"/>
      <circle cx="280" cy="110" r="19" fill="#ffdcc0" stroke="#2a1a12" stroke-width="5"/>
      <path d="M273 100 L272 92 M281 98 L282 90 M288 101 L293 95" stroke="#2a1a12" stroke-width="3" stroke-linecap="round"/>
    </g></g>
    <path d="M214 92 l-14 -8 M218 108 l-16 0 M220 122 l-14 8" stroke="#ffd166" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></path>

    <!-- coffee mug -->
    <path d="M356 312 q16 0 16 14 q0 14 -16 14" fill="none" stroke="#2a1a12" stroke-width="5"/>
    <rect x="316" y="298" width="42" height="44" rx="8" fill="#fff6ec" stroke="#2a1a12" stroke-width="5"/>
    <rect x="316" y="316" width="42" height="12" fill="#d98a5a"/>
    <path d="M328 288 q-6 -10 0 -20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"><animate attributeName="opacity" values=".7;0;.7" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M344 290 q6 -10 0 -22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"><animate attributeName="opacity" values="0;.7;0" dur="2.6s" repeatCount="indefinite"/></path>
  </g>
  <rect x="1" y="1" width="418" height="358" rx="23" fill="none" stroke="#70a5fd" stroke-opacity=".35" stroke-width="2"/>
</svg>
