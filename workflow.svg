<svg xmlns="http://www.w3.org/2000/svg" width="460" height="372" viewBox="0 0 460 372" role="img" aria-label="Diagram of an AI customer-support workflow: customer message, n8n workflow, LLM with RAG, then reply or human handoff." font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
<title>AI support workflow</title>
<defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a38"/><stop offset="1" stop-color="#0d1022"/></linearGradient></defs>
<rect x="1" y="1" width="458" height="370" rx="18" fill="url(#p)" stroke="#70a5fd" stroke-opacity=".35"/>
<text x="230" y="32" font-size="12" font-weight="700" fill="#8fb0ff" text-anchor="middle" letter-spacing="3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">HOW MY SUPPORT AGENTS WORK</text>
<g><rect x="28" y="52" width="404" height="60" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#70a5fd" stroke-opacity=".55"/>
<circle cx="64" cy="82" r="18" fill="#70a5fd" fill-opacity=".18" stroke="#70a5fd"/>
<text x="64" y="88" font-size="16" font-weight="700" fill="#70a5fd" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">1</text>
<text x="96" y="79" font-size="16" font-weight="700" fill="#e6edf3">Customer message</text>
<text x="96" y="98" font-size="12" fill="#9aa7c4" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">Website · Messenger · Instagram</text></g>
<g><rect x="28" y="138" width="404" height="60" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#38bdf8" stroke-opacity=".55"/>
<circle cx="64" cy="168" r="18" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8"/>
<text x="64" y="174" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">2</text>
<text x="96" y="165" font-size="16" font-weight="700" fill="#e6edf3">n8n workflow</text>
<text x="96" y="184" font-size="12" fill="#9aa7c4" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">route · enrich · call tools</text></g>
<g><rect x="28" y="224" width="404" height="60" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#bf91f3" stroke-opacity=".55"/>
<circle cx="64" cy="254" r="18" fill="#bf91f3" fill-opacity=".18" stroke="#bf91f3"/>
<text x="64" y="260" font-size="16" font-weight="700" fill="#bf91f3" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">3</text>
<text x="96" y="251" font-size="16" font-weight="700" fill="#e6edf3">LLM + RAG</text>
<text x="96" y="270" font-size="12" fill="#9aa7c4" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">LangChain · Qdrant · PostgreSQL</text></g>
<g><rect x="28" y="310" width="404" height="60" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#38bdae" stroke-opacity=".55"/>
<circle cx="64" cy="340" r="18" fill="#38bdae" fill-opacity=".18" stroke="#38bdae"/>
<text x="64" y="346" font-size="16" font-weight="700" fill="#38bdae" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">4</text>
<text x="96" y="337" font-size="16" font-weight="700" fill="#e6edf3">Reply or human handoff</text>
<text x="96" y="356" font-size="12" fill="#9aa7c4" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">75%+ Tier-1 auto-resolved</text></g>
<line x1="64" y1="112" x2="64" y2="138" stroke="#70a5fd" stroke-opacity=".5" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.6s" repeatCount="indefinite"/></line>
<circle cx="64" cy="112" r="3.5" fill="#fff"><animate attributeName="cy" values="112;138" dur="1.8s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/></circle>
<line x1="64" y1="198" x2="64" y2="224" stroke="#70a5fd" stroke-opacity=".5" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.6s" repeatCount="indefinite"/></line>
<circle cx="64" cy="198" r="3.5" fill="#fff"><animate attributeName="cy" values="198;224" dur="1.8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
<line x1="64" y1="284" x2="64" y2="310" stroke="#70a5fd" stroke-opacity=".5" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1.6s" repeatCount="indefinite"/></line>
<circle cx="64" cy="284" r="3.5" fill="#fff"><animate attributeName="cy" values="284;310" dur="1.8s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="1.0s" repeatCount="indefinite"/></circle>
</svg>