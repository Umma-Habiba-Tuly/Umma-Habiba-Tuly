<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Illustration of a laptop running code, connected to floating nodes labelled LLM, RAG, n8n and API.">
  <title>AI automation workspace</title>
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#70A5FD" stop-opacity=".45"/>
      <stop offset="1" stop-color="#70A5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <ellipse cx="210" cy="150" rx="200" ry="140" fill="url(#halo)">
      <animate attributeName="opacity" values=".6;1;.6" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- connections -->
    <g stroke="#70A5FD" stroke-width="1.6" stroke-dasharray="4 5" fill="none">
      <path d="M110 110 L62 62"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/></path>
      <path d="M310 110 L362 58"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M110 170 L56 228"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.2s" repeatCount="indefinite"/></path>
      <path d="M310 170 L366 226"><animate attributeName="stroke-dashoffset" values="0;-18" dur="2.6s" repeatCount="indefinite"/></path>
    </g>

    <!-- laptop -->
    <path d="M86 214 H334 L352 240 H68 Z" fill="#1A1B27" stroke="#70A5FD" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="188" y="222" width="44" height="6" rx="3" fill="#38BDAE" opacity=".7"/>
    <rect x="104" y="64" width="212" height="150" rx="10" fill="#0D1117" stroke="#70A5FD" stroke-width="3"/>
    <circle cx="120" cy="80" r="3.5" fill="#38BDF8"/>
    <circle cx="132" cy="80" r="3.5" fill="#38BDAE"/>
    <circle cx="144" cy="80" r="3.5" fill="#E6EDF3" opacity=".7"/>

    <!-- code lines -->
    <g>
      <rect x="120" y="100" width="70" height="7" rx="3.5" fill="#38BDF8"><animate attributeName="width" values="0;70" dur="1.2s" begin="0.3s" fill="freeze"/></rect>
      <rect x="198" y="100" width="56" height="7" rx="3.5" fill="#E6EDF3"><animate attributeName="width" values="0;56" dur="1s" begin="1.1s" fill="freeze"/></rect>
      <rect x="136" y="118" width="90" height="7" rx="3.5" fill="#38BDAE"><animate attributeName="width" values="0;90" dur="1.2s" begin="1.8s" fill="freeze"/></rect>
      <rect x="136" y="136" width="52" height="7" rx="3.5" fill="#E6EDF3" opacity=".85"><animate attributeName="width" values="0;52" dur="1s" begin="2.6s" fill="freeze"/></rect>
      <rect x="196" y="136" width="64" height="7" rx="3.5" fill="#38BDF8"><animate attributeName="width" values="0;64" dur="1s" begin="3.3s" fill="freeze"/></rect>
      <rect x="136" y="154" width="100" height="7" rx="3.5" fill="#38BDAE"><animate attributeName="width" values="0;100" dur="1.2s" begin="4s" fill="freeze"/></rect>
      <rect x="120" y="172" width="58" height="7" rx="3.5" fill="#E6EDF3" opacity=".85"><animate attributeName="width" values="0;58" dur="1s" begin="4.9s" fill="freeze"/></rect>
      <rect x="186" y="170" width="8" height="12" fill="#38BDF8"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- floating nodes -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" repeatCount="indefinite"/>
      <circle cx="56" cy="56" r="25" fill="#1A1B27" stroke="#BF91F3" stroke-width="2"/>
      <text x="56" y="60" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="middle">LLM</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="366" cy="52" r="25" fill="#1A1B27" stroke="#70A5FD" stroke-width="2"/>
      <text x="366" y="56" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="middle">RAG</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="5.5s" repeatCount="indefinite"/>
      <circle cx="50" cy="234" r="25" fill="#1A1B27" stroke="#70A5FD" stroke-width="2"/>
      <text x="50" y="238" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="middle">n8n</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6.5s" repeatCount="indefinite"/>
      <circle cx="372" cy="232" r="25" fill="#1A1B27" stroke="#BF91F3" stroke-width="2"/>
      <text x="372" y="236" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="middle">API</text>
    </g>
  </g>
</svg>
